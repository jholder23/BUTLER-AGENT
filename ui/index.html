<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Butler</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        if (localStorage.getItem('butler-theme') === 'dark') document.documentElement.classList.add('theme-dark');
      } catch (e) {}
    </script>
    <style>
      /* First paint: light default; script may add .theme-dark before paint */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #e8f0ff;
      }
      html.theme-dark body {
        background: #030308;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
